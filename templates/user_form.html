{% extends "base.html" %}
{% block title %}הוספת משתמש – URI System{% endblock %}
{% block content %}
<div class="page-header">
    <h1>➕ הוספת משתמש</h1>
    <a href="{{ url_for('manage_users') }}" class="btn btn-ghost">← חזרה</a>
</div>

<div class="card" style="max-width: 460px;">
    <form method="POST">
        <div class="form-group">
            <label for="username">שם משתמש *</label>
            <input type="text" id="username" name="username" class="form-control"
                   placeholder="לדוגמה: yossi123" required/>
        </div>
        <div class="form-group">
            <label for="password">סיסמה *</label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="סיסמה חזקה..." required/>
        </div>
        <div class="form-group">
            <label for="role">תפקיד</label>
            <select id="role" name="role" class="form-control">
                <option value="user">👤 משתמש רגיל</option>
                <option value="admin">🔑 מנהל</option>
            </select>
        </div>
        <div style="display:flex; gap:12px; margin-top:8px;">
            <button type="submit" class="btn btn-green">✅ הוסף משתמש</button>
            <a href="{{ url_for('manage_users') }}" class="btn btn-ghost">ביטול</a>
        </div>
    </form>
</div>
{% endblock %}
