{% extends "base.html" %}
{% block title %}{{ 'עריכת מחשב' if action == 'edit' else 'הוספת מחשב' }} – URI System{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ '✏️ עריכת מחשב' if action == 'edit' else '➕ הוספת מחשב' }}</h1>
    <a href="{{ url_for('computers') }}" class="btn btn-ghost">← חזרה</a>
</div>

<div class="card" style="max-width: 650px; margin: 0 auto; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="barcode">ברקוד מחשב *</label>
                <input type="text" id="barcode" name="barcode" class="form-control"
                    value="{{ computer.barcode if computer else '' }}" required {{ 'readonly' if action=='edit' else ''
                    }} />
            </div>
            <div class="form-group">
                <label for="case_number">מספר תיק</label>
                <input type="text" id="case_number" name="case_number" class="form-control"
                    value="{{ computer.case_number if computer else '' }}" />
            </div>
            <div class="form-group">
                <label for="cage_number">מספר כלוב</label>
                <input type="text" id="cage_number" name="cage_number" class="form-control"
                    value="{{ computer.cage_number if computer else '' }}" />
            </div>
            <div class="form-group">
                <label for="status">סטטוס</label>
                <select id="status" name="status" class="form-control">
                    {% set cur_status = computer.status if computer else 'פעיל' %}
                    <option value="פעיל" {% if cur_status=='פעיל' %}selected{% endif %}>✅ פעיל</option>
                    <option value="תקול" {% if cur_status=='תקול' %}selected{% endif %}>❌ תקול</option>
                    <option value="בתיקון" {% if cur_status=='בתיקון' %}selected{% endif %}>🔧 בתיקון</option>
                    <option value="מאוחסן" {% if cur_status=='מאוחסן' %}selected{% endif %}>📦 מאוחסן</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">מיקום</label>
                <input type="text" id="location" name="location" class="form-control"
                    value="{{ computer.location if computer else '' }}" />
            </div>
            <div class="form-group">
                <label for="exam_appeal">מבחן \ ערעור</label>
                <input type="text" id="exam_appeal" name="exam_appeal" class="form-control"
                    value="{{ computer.exam_appeal if computer else '' }}" />
            </div>
        </div>
        <div class="form-group" style="margin-top: 20px;">
            <label for="notes">הערות</label>
            <textarea id="notes" name="notes" class="form-control"
                style="min-height: 120px;">{{ computer.notes if computer else '' }}</textarea>
        </div>
        <div style="display:flex; gap:16px; margin-top:24px; justify-content: flex-end; flex-wrap: wrap;">
            <a href="{{ url_for('computers') }}" class="btn btn-ghost" style="flex: 1; text-align: center; min-width: 120px;">ביטול</a>
            <button type="submit" class="btn btn-blue" style="flex: 2; min-width: 180px;">
                {{ '💾 שמור שינויים' if action == 'edit' else '✅ הוסף מחשב' }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
