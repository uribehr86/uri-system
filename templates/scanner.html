{% extends "base.html" %}

{% block title %}סורק מקצועי - URI System{% endblock %}

{% block content %}
<style>
  .scan-page { display: flex; flex-direction: column; height: calc(100vh - 60px); overflow: hidden; background: #0a0f1e; color: #fff; font-family: 'Segoe UI', sans-serif; }

  /* Mode Tabs */
  .mode-bar { display: flex; gap: 6px; padding: 10px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.07); }
  .mode-btn { flex: 1; padding: 9px 6px; border-radius: 10px; border: none; font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.06); color: #94a3b8; }
  .mode-btn.active { background: #2563eb; color: #fff; box-shadow: 0 2px 12px rgba(37,99,235,0.5); }

  /* Camera */
  .camera-wrap { position: relative; width: 100%; flex: 1; background: #000; overflow: hidden; max-height: 52vh; }
  #reader { width: 100%; height: 100%; }
  #reader video { width: 100%; height: 100%; object-fit: cover; }

  /* Scan overlay box */
  .scan-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .scan-box { width: 210px; height: 130px; border: 3px solid #2563eb; border-radius: 14px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.38); position: relative; transition: border-color 0.3s, box-shadow 0.3s; }
  .scan-box.success { border-color: #22c55e; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35), 0 0 24px rgba(34,197,94,0.6); }
  .scan-box.fail    { border-color: #ef4444; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35), 0 0 24px rgba(239,68,68,0.6); }

  /* Corner accents */
  .scan-box::before, .scan-box::after { content: ''; position: absolute; width: 18px; height: 18px; border-style: solid; transition: border-color 0.3s; }
  .scan-box::before { top: -3px; right: -3px; border-width: 3px 3px 0 0; border-color: inherit; border-radius: 0 8px 0 0; }
  .scan-box::after  { bottom: -3px; left: -3px; border-width: 0 0 3px 3px; border-color: inherit; border-radius: 0 0 0 8px; }

  /* Scan line animation */
  .scan-line { position: absolute; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #60a5fa, transparent); animation: scanMove 1.8s linear infinite; }
  .scan-box.success .scan-line { background: linear-gradient(90deg, transparent, #4ade80, transparent); }
  .scan-box.fail    .scan-line { display: none; }
  @keyframes scanMove { 0%,100% { top: 0; opacity: 0.7; } 50% { top: 100%; opacity: 0.4; } }

  /* Fail message overlay */
  .fail-msg { position: absolute; bottom: -44px; left: 50%; transform: translateX(-50%); background: rgba(239,68,68,0.9); color: #fff; font-size: 0.78rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; white-space: nowrap; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .scan-box.fail .fail-msg { opacity: 1; }

  /* Torch */
  .torch-btn { position: absolute; bottom: 14px; left: 14px; z-index: 20; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.55); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .torch-btn.on { background: #2563eb; }

  /* Bottom panel */
  .bottom-panel { background: #0f172a; border-top: 1px solid rgba(255,255,255,0.07); padding: 10px 14px 14px; flex-shrink: 0; }

  /* Fast mode controls */
  .fast-controls { display: flex; gap: 8px; align-items: center; }
  .fast-controls select, .fast-controls input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; padding: 10px; border-radius: 10px; font-size: 0.9rem; outline: none; }
  .fast-controls select option { background: #1e293b; }
  .scan-counter { text-align: center; margin-top: 8px; font-size: 0.78rem; color: #475569; }
  .scan-counter span { color: #60a5fa; font-weight: 800; font-size: 1rem; }

  /* Waiting hint */
  .waiting-hint { text-align: center; padding: 10px 0 4px; font-size: 0.8rem; color: #475569; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #2563eb; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } }

  /* Toast */
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #16a34a; color: #fff; padding: 12px 22px; border-radius: 30px; font-weight: 700; font-size: 0.95rem; z-index: 200; transition: transform 0.3s cubic-bezier(.17,.67,.39,1.3); white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  #toast.err { background: #dc2626; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* Full mode sheet */
  .sheet-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.75); backdrop-filter: blur(3px); }
  .sheet-overlay.show { display: flex; align-items: flex-end; }
  .sheet { background: #111827; border-radius: 24px 24px 0 0; width: 100%; padding: 20px 18px 30px; border-top: 3px solid #2563eb; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
  .sheet-overlay.show .sheet { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: #334155; border-radius: 4px; margin: 0 auto 18px; }
  .sheet h3 { text-align: center; font-size: 1.3rem; font-weight: 900; margin-bottom: 16px; }
  .sheet h3 span { color: #60a5fa; }
  .form-row-scan { display: flex; gap: 10px; margin-bottom: 12px; }
  .form-field-scan { flex: 1; }
  .form-field-scan label { display: block; font-size: 0.72rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
  .form-field-scan input, .form-field-scan select, .form-field-scan textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 11px; border-radius: 10px; font-size: 0.95rem; outline: none; box-sizing: border-box; }
  .form-field-scan textarea { resize: none; height: 80px; }
  .sheet-btns { display: flex; gap: 10px; margin-top: 16px; }
  .btn-save { flex: 2; background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; }
  .btn-cancel { flex: 1; background: rgba(255,255,255,0.06); color: #94a3b8; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }
  .badge-new { display: inline-block; background: #7c3aed; color: #fff; font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 20px; margin-right: 6px; vertical-align: middle; }

  /* Cage mode */
  .cage-scan-hint { text-align: center; padding: 12px; font-size: 0.85rem; color: #64748b; }
  .cage-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px; margin-top: 6px; }
  .cage-title { font-size: 1.1rem; font-weight: 900; margin-bottom: 8px; }
  .cage-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .cage-stat { background: rgba(37,99,235,0.15); border: 1px solid rgba(37,99,235,0.3); border-radius: 8px; padding: 5px 10px; font-size: 0.78rem; font-weight: 700; }
  .cage-stat span { color: #60a5fa; font-size: 1rem; }
  .cage-list { max-height: 120px; overflow-y: auto; font-size: 0.78rem; color: #94a3b8; }
  .cage-list-item { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; }
  .btn-use-cage { width: 100%; margin-top: 10px; background: rgba(37,99,235,0.2); border: 1px solid #2563eb; color: #60a5fa; font-weight: 700; padding: 9px; border-radius: 10px; cursor: pointer; font-size: 0.88rem; }

  /* Manual input fallback */
  .manual-input-wrap { margin-top: 8px; display: flex; gap: 6px; }
  .manual-input-wrap input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(239,68,68,0.5); color: #fff; padding: 9px 12px; border-radius: 10px; font-size: 0.9rem; outline: none; }
  .manual-input-wrap button { background: #ef4444; color: #fff; border: none; padding: 9px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
</style>

<div class="scan-page">

  <!-- Mode selector -->
  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('fast')" id="btn-fast">⚡ מהיר</button>
    <button class="mode-btn" onclick="setMode('full')" id="btn-full">🔍 מלא</button>
    <button class="mode-btn" onclick="setMode('cage')" id="btn-cage">📦 כלוב</button>
  </div>

  <!-- Camera -->
  <div class="camera-wrap">
    <div id="reader"></div>
    <!-- Scan box overlay with visual feedback -->
    <div class="scan-overlay">
      <div class="scan-box" id="scan-box">
        <div class="scan-line"></div>
        <div class="fail-msg" id="fail-msg">⚠️ לא זוהה — נסה שוב או הקלד ידנית</div>
      </div>
    </div>
    <button class="torch-btn" id="torch-btn" onclick="toggleTorch()">🔦</button>
  </div>

  <!-- Bottom panel -->
  <div class="bottom-panel">

    <!-- FAST MODE -->
    <div id="panel-fast">
      <div class="fast-controls">
        <select id="fast-location">
          <option value="">📍 בחר מיקום</option>
          <option value="מחסן">📦 מחסן</option>
          <option value="אפעל 6">🏢 אפעל 6</option>
          <option value="אקספו">🏛️ אקספו</option>
          <option value="בנייני האומה">🏟️ בנייני האומה</option>
          <option value="שיבא">🏥 שיבא</option>
          <option value="בית">🏠 בית</option>
          <option value="חוץ">🌍 חוץ</option>
        </select>
        <input type="text" id="fast-cage" placeholder="כלוב #" style="max-width:90px;text-align:center;font-size:1.1rem;font-weight:800;" />
        <select id="fast-status">
          <option value="פעיל">✅ תקין</option>
          <option value="תקול">❌ תקול</option>
          <option value="בתיקון">🔧 בתיקון</option>
        </select>
      </div>
      <div class="waiting-hint"><div class="pulse-dot"></div> ממתין לסריקה...</div>
      <div id="manual-wrap" class="manual-input-wrap" style="display:none;">
        <input type="text" id="manual-barcode" placeholder="הקלד ברקוד ידנית..." />
        <button onclick="submitManual()">אישור</button>
      </div>
      <div class="scan-counter">סרוקים בסשן: <span id="session-count">0</span></div>
    </div>

    <!-- FULL MODE -->
    <div id="panel-full" style="display:none;">
      <div class="waiting-hint"><div class="pulse-dot"></div> סרוק מחשב לפתיחת טופס</div>
      <div id="manual-wrap-full" class="manual-input-wrap" style="display:none;">
        <input type="text" id="manual-barcode-full" placeholder="הקלד ברקוד ידנית..." />
        <button onclick="submitManualFull()">אישור</button>
      </div>
    </div>

    <!-- CAGE MODE -->
    <div id="panel-cage" style="display:none;">
      <div class="cage-scan-hint">סרוק ברקוד של כלוב לצפייה במידע</div>
      <div id="cage-card-area"></div>
    </div>

  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Full mode sheet -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="sheet-title">מחשב: <span id="sheet-barcode"></span></h3>
    <input type="hidden" id="sheet-id">
    <div class="form-row-scan">
      <div class="form-field-scan">
        <label>מיקום</label>
        <select id="sh-location">
          <option value="">לא נבחר</option>
          <option value="מחסן">מחסן</option>
          <option value="אפעל 6">אפעל 6</option>
          <option value="אקספו">אקספו</option>
          <option value="בנייני האומה">בנייני האומה</option>
          <option value="שיבא">שיבא</option>
          <option value="בית">בית</option>
          <option value="חוץ">חוץ</option>
        </select>
      </div>
      <div class="form-field-scan">
        <label>כלוב</label>
        <input type="text" id="sh-cage" placeholder="מספר כלוב">
      </div>
    </div>
    <div class="form-row-scan">
      <div class="form-field-scan">
        <label>סטטוס</label>
        <select id="sh-status">
          <option value="פעיל">✅ תקין</option>
          <option value="תקול">❌ תקול</option>
          <option value="בתיקון">🔧 בתיקון</option>
          <option value="אחר">אחר</option>
        </select>
      </div>
      <div class="form-field-scan">
        <label>מספר תיק</label>
        <input type="text" id="sh-case" placeholder="מספר תיק">
      </div>
    </div>
    <div class="form-row-scan">
      <div class="form-field-scan">
        <label>מבחן/ערעור</label>
        <input type="text" id="sh-exam" placeholder="פרטים...">
      </div>
    </div>
    <div class="form-row-scan">
      <div class="form-field-scan">
        <label>הערות</label>
        <textarea id="sh-notes" placeholder="הערות חופשיות..."></textarea>
      </div>
    </div>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="closeSheet()">ביטול</button>
      <button class="btn-save" onclick="saveFullScan()">💾 שמור וסרוק הבא</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
  let scanner = null;
  let currentMode = 'fast';
  let isTorchOn = false;
  let sessionCount = 0;
  let isSheetOpen = false;
  let lastCageScan = '';

  // ── Scan box visual feedback ─────────────────────────────────────────
  let failTimer = null;
  let manualShown = false;

  function setScanBoxState(state) {
    // state: 'idle' | 'success' | 'fail'
    const box = document.getElementById('scan-box');
    box.classList.remove('success', 'fail');
    if (state === 'success') box.classList.add('success');
    if (state === 'fail')    box.classList.add('fail');
  }

  function resetFailTimer() {
    // Clear any existing timer
    if (failTimer) clearTimeout(failTimer);
    manualShown = false;
    setScanBoxState('idle');
    hideManualInput();

    // After 5 seconds of no successful scan → go red
    failTimer = setTimeout(() => {
      if (!isSheetOpen) {
        setScanBoxState('fail');
        showManualInput();
      }
    }, 5000);
  }

  function showManualInput() {
    if (manualShown) return;
    manualShown = true;
    const wrapId = currentMode === 'full' ? 'manual-wrap-full' : 'manual-wrap';
    const el = document.getElementById(wrapId);
    if (el) el.style.display = 'flex';
  }

  function hideManualInput() {
    ['manual-wrap', 'manual-wrap-full'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  }

  function onScanSuccess_visual() {
    if (failTimer) clearTimeout(failTimer);
    setScanBoxState('success');
    hideManualInput();
    manualShown = false;
    // Reset back to idle after 1.5s, then restart fail timer
    setTimeout(() => {
      setScanBoxState('idle');
      if (!isSheetOpen) resetFailTimer();
    }, 1500);
  }

  // ── Toast ─────────────────────────────────────────────────────────────
  function showToast(msg, isErr = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isErr ? 'err show' : 'show';
    if (navigator.vibrate) navigator.vibrate(isErr ? [100,50,100] : 80);
    setTimeout(() => t.className = isErr ? 'err' : '', 2200);
  }

  // ── Mode switching ────────────────────────────────────────────────────
  function setMode(mode) {
    currentMode = mode;
    lastCageScan = '';
    ['fast','full','cage'].forEach(m => {
      document.getElementById('btn-' + m).classList.toggle('active', m === mode);
      document.getElementById('panel-' + m).style.display = m === mode ? 'block' : 'none';
    });
    if (mode !== 'cage') document.getElementById('cage-card-area').innerHTML = '';
    resetFailTimer();
  }

  // ── Camera ────────────────────────────────────────────────────────────
  async function startScanner() {
    scanner = new Html5Qrcode('reader');
    try {
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 220, height: 130 } },
        onScan,
        () => {}
      );
      resetFailTimer(); // Start the fail countdown after camera starts
    } catch (err) {
      setScanBoxState('fail');
      showToast('שגיאה: אשר גישה למצלמה', true);
    }
  }

  async function toggleTorch() {
    isTorchOn = !isTorchOn;
    try {
      await scanner.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] });
      document.getElementById('torch-btn').classList.toggle('on', isTorchOn);
    } catch(e) { /* not supported */ }
  }

  // ── Scan dispatcher ───────────────────────────────────────────────────
  function onScan(code) {
    const clean = code.trim();
    if (currentMode === 'cage') onCageScan(clean);
    else if (currentMode === 'fast') onFastScan(clean);
    else onFullScan(clean);
  }

  // ── FAST SCAN ─────────────────────────────────────────────────────────
  let fastCooldown = false;
  function onFastScan(barcode) {
    if (fastCooldown) return;
    fastCooldown = true;
    setTimeout(() => fastCooldown = false, 1500);

    const location = document.getElementById('fast-location').value;
    const cage = document.getElementById('fast-cage').value.trim();
    const status = document.getElementById('fast-status').value;

    if (!location) {
      showToast('⚠️ בחר מיקום תחילה!', true);
      return;
    }

    fetch('/api/fast-scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ barcode, location, cage_number: cage, cage_name: cage, status })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        onScanSuccess_visual();
        sessionCount++;
        document.getElementById('session-count').textContent = sessionCount;
        showToast(`${data.is_new ? '🆕' : '✓'} ${barcode}  |  כלוב ${cage || '—'}`);
        resetFailTimer();
      } else {
        setScanBoxState('fail');
        showToast('שגיאה: ' + (data.error || 'לא ידוע'), true);
      }
    })
    .catch(() => { setScanBoxState('fail'); showToast('שגיאת חיבור', true); });
  }

  function submitManual() {
    const val = document.getElementById('manual-barcode').value.trim();
    if (val) { document.getElementById('manual-barcode').value = ''; onFastScan(val); }
  }
  function submitManualFull() {
    const val = document.getElementById('manual-barcode-full').value.trim();
    if (val) { document.getElementById('manual-barcode-full').value = ''; onFullScan(val); }
  }

  // ── FULL SCAN ─────────────────────────────────────────────────────────
  function onFullScan(barcode) {
    if (isSheetOpen) return;
    scanner.pause();
    fetch('/api/process-scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ barcode })
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) throw new Error(data.error);
      onScanSuccess_visual();
      openSheet(data.computer, !data.exists);
    })
    .catch(err => {
      setScanBoxState('fail');
      showToast('שגיאה: ' + err.message, true);
      scanner.resume();
      resetFailTimer();
    });
  }

  function openSheet(computer, isNew) {
    isSheetOpen = true;
    if (failTimer) clearTimeout(failTimer);
    hideManualInput();
    document.getElementById('sheet-title').innerHTML =
      (isNew ? '<span class="badge-new">חדש</span>' : '') +
      'מחשב: <span id="sheet-barcode">' + computer.barcode + '</span>';
    document.getElementById('sheet-id').value = computer.id;
    document.getElementById('sh-location').value = computer.location || '';
    document.getElementById('sh-cage').value = computer.cage_number || '';
    document.getElementById('sh-status').value = computer.status || 'פעיל';
    document.getElementById('sh-case').value = computer.case_number || '';
    document.getElementById('sh-exam').value = computer.exam_appeal || '';
    document.getElementById('sh-notes').value = computer.notes || '';
    document.getElementById('sheet-overlay').classList.add('show');
  }

  function closeSheet(e) {
    if (e && e.target !== document.getElementById('sheet-overlay')) return;
    document.getElementById('sheet-overlay').classList.remove('show');
    isSheetOpen = false;
    setTimeout(() => { scanner.resume(); resetFailTimer(); }, 300);
  }

  function saveFullScan() {
    const data = {
      id: document.getElementById('sheet-id').value,
      location: document.getElementById('sh-location').value,
      cage_number: document.getElementById('sh-cage').value,
      cage_name: document.getElementById('sh-cage').value,
      status: document.getElementById('sh-status').value,
      case_number: document.getElementById('sh-case').value,
      exam_appeal: document.getElementById('sh-exam').value,
      notes: document.getElementById('sh-notes').value
    };
    fetch('/api/update-computer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        document.getElementById('sheet-overlay').classList.remove('show');
        isSheetOpen = false;
        showToast('✓ נשמר!');
        setTimeout(() => { scanner.resume(); resetFailTimer(); }, 300);
      } else { showToast('שגיאה בשמירה', true); }
    })
    .catch(() => showToast('שגיאת חיבור', true));
  }

  // ── CAGE SCAN ─────────────────────────────────────────────────────────
  let cageCooldown = false;
  function onCageScan(cageId) {
    if (cageCooldown || cageId === lastCageScan) return;
    cageCooldown = true; lastCageScan = cageId;
    setTimeout(() => cageCooldown = false, 2500);
    if (navigator.vibrate) navigator.vibrate(60);
    onScanSuccess_visual();

    fetch('/api/cage/' + encodeURIComponent(cageId))
    .then(r => r.json())
    .then(data => {
      if (data.error) throw new Error(data.error);
      renderCageCard(data, cageId);
      resetFailTimer();
    })
    .catch(err => { setScanBoxState('fail'); showToast('שגיאה: ' + err.message, true); });
  }

  function renderCageCard(data, cageId) {
    const cage = data.cage || {};
    const statuses = data.status_counts || {};
    const computers = data.computers || [];
    let statsHtml = Object.entries(statuses).map(([s,c]) => `<div class="cage-stat"><span>${c}</span> ${s}</div>`).join('');
    if (!statsHtml) statsHtml = '<div class="cage-stat"><span>0</span> מחשבים</div>';
    let listHtml = computers.slice(0,20).map(c =>
      `<div class="cage-list-item"><span>${c.barcode}</span><span style="color:${c.status==='תקול'?'#f87171':'#86efac'}">${c.status||'—'}</span></div>`
    ).join('') || '<div style="text-align:center;color:#475569;padding:8px;">כלוב ריק</div>';

    document.getElementById('cage-card-area').innerHTML = `
      <div class="cage-card">
        <div class="cage-title">📦 כלוב ${cage.cage_id||cageId} ${cage.name?'— '+cage.name:''}</div>
        ${cage.location?`<div style="color:#64748b;font-size:0.78rem;margin-bottom:8px;">📍 ${cage.location}</div>`:''}
        <div class="cage-stats"><div class="cage-stat">סה"כ <span>${data.total||0}</span></div>${statsHtml}</div>
        <div class="cage-list">${listHtml}</div>
        <button class="btn-use-cage" onclick="useCageInFastMode('${cage.cage_id||cageId}')">⚡ מצב מהיר עם כלוב זה</button>
      </div>`;
  }

  function useCageInFastMode(cageId) {
    document.getElementById('fast-cage').value = cageId;
    setMode('fast');
    showToast('✓ כלוב ' + cageId + ' נבחר!');
  }

  // ── Restore settings ──────────────────────────────────────────────────
  window.addEventListener('load', () => {
    const loc = localStorage.getItem('uri_last_loc');
    const cage = localStorage.getItem('uri_last_cage');
    if (loc) document.getElementById('fast-location').value = loc;
    if (cage) document.getElementById('fast-cage').value = cage;
    startScanner();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      localStorage.setItem('uri_last_loc', document.getElementById('fast-location').value);
      localStorage.setItem('uri_last_cage', document.getElementById('fast-cage').value);
    }
  });

  // Manual input: submit on Enter
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.activeElement.id === 'manual-barcode') submitManual();
      if (document.activeElement.id === 'manual-barcode-full') submitManualFull();
    }
  });
</script>
{% endblock %}
