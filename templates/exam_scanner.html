{% extends 'base.html' %}
{% block title %}סורק נוכחות בחינה{% endblock %}
{% block content %}
<style>
  .scan-page { display: flex; flex-direction: column; height: calc(100vh - 60px); overflow: hidden; background: #0a0f1e; color: #fff; font-family: 'Segoe UI', sans-serif; }

  /* Top Info */
  .top-info { padding: 16px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.07); text-align: center; }
  .top-info h2 { margin: 0 0 6px 0; font-size: 1.4rem; font-weight: 800; color: #60a5fa; }
  .top-info p { margin: 0; color: #94a3b8; font-size: 0.9rem; }

  /* Camera */
  .camera-wrap { position: relative; width: 100%; flex: 1; background: #000; overflow: hidden; max-height: 50vh; }
  #reader { width: 100%; height: 100%; }
  #reader video { width: 100%; height: 100%; object-fit: cover; }

  /* Scan overlay box */
  .scan-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .scan-box { width: 220px; height: 220px; border: 3px solid #2563eb; border-radius: 14px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4); position: relative; transition: border-color 0.3s, box-shadow 0.3s; }
  .scan-box.success { border-color: #22c55e; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4), 0 0 24px rgba(34,197,94,0.6); }
  .scan-box.error { border-color: #ef4444; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4), 0 0 24px rgba(239,68,68,0.6); }

  /* Corner accents */
  .scan-box::before, .scan-box::after { content: ''; position: absolute; width: 18px; height: 18px; border-style: solid; transition: border-color 0.3s; }
  .scan-box::before { top: -3px; right: -3px; border-width: 3px 3px 0 0; border-color: inherit; border-radius: 0 8px 0 0; }
  .scan-box::after  { bottom: -3px; left: -3px; border-width: 0 0 3px 3px; border-color: inherit; border-radius: 0 0 0 8px; }

  /* Scan line animation */
  .scan-line { position: absolute; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #60a5fa, transparent); animation: scanMove 1.8s linear infinite; }
  .scan-box.success .scan-line { background: linear-gradient(90deg, transparent, #4ade80, transparent); }
  .scan-box.error .scan-line { display: none; }
  @keyframes scanMove { 0%,100% { top: 0; opacity: 0.7; } 50% { top: 100%; opacity: 0.4; } }

  /* Success Burst Fade Away */
  .success-burst { position: absolute; inset: -10px; border: 4px solid #22c55e; border-radius: 18px; opacity: 0; pointer-events: none; z-index: 10; }
  .success-burst.animate { animation: successFadeOut 0.8s ease-out forwards; }
  @keyframes successFadeOut {
    0% { transform: scale(0.9); opacity: 1; border-width: 6px; }
    100% { transform: scale(1.3); opacity: 0; border-width: 1px; }
  }

  /* Bottom panel */
  .bottom-panel { background: #0f172a; border-top: 1px solid rgba(255,255,255,0.07); padding: 16px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  .scan-counter { background: rgba(37,99,235,0.1); padding: 12px 24px; border-radius: 12px; border: 1px solid rgba(37,99,235,0.3); font-weight: 700; color: #94a3b8; font-size: 1.1rem; width: 100%; text-align: center; margin-bottom: 12px; }
  .scan-counter span { color: #4ade80; font-size: 1.4rem; font-weight: 900; }
  
  .manual-input-wrap { display: flex; gap: 8px; width: 100%; }
  .manual-input-wrap input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 10px; font-size: 0.95rem; outline: none; }
  .manual-input-wrap button { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 12px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; }

  /* Full mode sheet (Slide-up modal) */
  .sheet-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.75); backdrop-filter: blur(3px); }
  .sheet-overlay.show { display: flex; align-items: flex-end; }
  .sheet { background: #111827; border-radius: 24px 24px 0 0; width: 100%; padding: 20px 18px 30px; border-top: 3px solid #2563eb; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
  .sheet-overlay.show .sheet { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: #334155; border-radius: 4px; margin: 0 auto 18px; }
  
  .sheet h3 { text-align: center; font-size: 1.4rem; font-weight: 900; margin: 0 0 6px 0; color: #fff; }
  .sheet p.subtitle { text-align: center; color: #94a3b8; margin: 0 0 20px 0; font-size: 1rem; }
  .sheet p.subtitle span { color: #60a5fa; font-weight: 700; }

  .form-field-scan { margin-bottom: 16px; }
  .form-field-scan label { display: block; font-size: 0.85rem; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
  .form-field-scan select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 14px; border-radius: 12px; font-size: 1rem; outline: none; appearance: none; font-weight: 700; }
  .form-field-scan select option { background: #111827; color: #fff; }

  .sheet-btns { display: flex; gap: 10px; margin-top: 24px; }
  .btn-save { flex: 2; background: #22c55e; color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
  .btn-save:active { transform: scale(0.98); }
  .btn-cancel { flex: 1; background: rgba(255,255,255,0.06); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); padding: 16px; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }

  /* Toast */
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #16a34a; color: #fff; padding: 12px 22px; border-radius: 30px; font-weight: 700; font-size: 0.95rem; z-index: 200; transition: transform 0.3s cubic-bezier(.17,.67,.39,1.3); white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  #toast.err { background: #dc2626; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>

<div class="scan-page">
  <!-- Top Info -->
  <div class="top-info">
    <h2>📱 סורק בחינות מקצועי</h2>
    <p>סרוק את ה-QR מקוד הברקוד של הנבחן</p>
  </div>

  <!-- Camera -->
  <div class="camera-wrap">
    <div id="reader"></div>
    <div class="scan-overlay">
      <div class="scan-box" id="scan-box">
        <div class="scan-line"></div>
        <div class="success-burst" id="success-burst"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Panel -->
  <div class="bottom-panel">
    <div class="scan-counter">
      סטודנטים שנסרקו: <span id="scanCount">0</span>
    </div>
    <div class="manual-input-wrap">
      <input type="text" id="manualInput" placeholder="הזן QR ידנית (לבדיקה)..." onkeypress="if(event.key==='Enter') processManual()">
      <button onclick="processManual()">בדוק</button>
    </div>
    <div style="margin-top: 20px; width: 100%; text-align: center;">
      <a href="{{ url_for('exam_attendance') }}" style="color: #64748b; text-decoration: none; font-size: 0.9rem; font-weight: 700;">← חזרה לדשבורד בחינות</a>
    </div>
  </div>
</div>

<!-- Slide-up Modal Sheet -->
<div class="sheet-overlay" id="confirmModal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="modalStudentName">שם הסטודנט</h3>
    <p class="subtitle">מחשב מספר: <span id="modalComputer">--</span></p>
    
    <div class="form-field-scan">
      <label>✅ סטטוס הגעה נבחן</label>
      <select id="modalAttendance">
        <option value="1">נוכח בבחינה</option>
        <option value="0">לא הגיע (נעדר)</option>
      </select>
    </div>
    
    <div class="form-field-scan">
      <label>💻 מצב ציוד (מחשב)</label>
      <select id="modalComputerStatus">
        <option value="תקין">תקין</option>
        <option value="תקול">תקול</option>
        <option value="בתיקון">בתיקון</option>
      </select>
    </div>
    
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="closeModal()">ביטול</button>
      <button class="btn-save" onclick="confirmSave()">💾 שמור נתונים</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- html5-qrcode -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let scanCount = 0;
let lastScanned = '';
let currentExamineeQR = null;
let currentExamineeData = null;
let currentComputerBarcode = '';
let isSheetOpen = false;

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 220, height: 220 } },
    async (decodedText) => {
        if (decodedText === lastScanned) return;
        if (isSheetOpen) return;
        lastScanned = decodedText;
        await processScan(decodedText);
        setTimeout(() => { lastScanned = ''; }, 2000);
    },
    (err) => {}
).catch(err => {
    console.warn('Camera error:', err);
});

function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'err show' : 'show';
  if (navigator.vibrate) navigator.vibrate(isErr ? [100,50,100] : 80);
  setTimeout(() => t.className = isErr ? 'err' : '', 3000);
}

function setScanBoxState(state) {
  const box = document.getElementById('scan-box');
  box.className = 'scan-box';
  if (state) box.classList.add(state);
}

async function processManual() {
    const val = document.getElementById('manualInput').value.trim();
    if (val) await processScan(val);
}

async function processScan(decodedText) {
    // שלב א: ממתין ל-QR של נבחן
    if (!currentExamineeQR) {
        // QR format: exam_name|id|name|username|password|row|seat (7 parts separated by |)
        let parts = decodedText.split('|');
        if (parts.length >= 6) {
            currentExamineeQR = decodedText;
            let examName = parts[0] || '';
            let name     = parts[2] || 'נבחן לא ידוע';
            currentExamineeData = {
                id:       parts[1] || '',
                name:     name,
                examName: examName,
                row:      parts[5] || '',
                seat:     parts[6] || ''
            };
            
            setScanBoxState('success');
            const burst = document.getElementById('success-burst');
            burst.classList.remove('animate');
            void burst.offsetWidth;
            burst.classList.add('animate');
            playBeep(true);
            
            showToast(`✅ ${examName} | ${name} (טור ${currentExamineeData.row}, כיסא ${currentExamineeData.seat}). כעת סרוק מדבקת מחשב!`);
            document.querySelector('.top-info p').textContent = `ממתין לסריקת ברקוד מחשב עבור: ${name}`;
            
            setTimeout(() => setScanBoxState(''), 1000);
        } else {
            setScanBoxState('error');
            showToast("אנא סרוק קוד נבחן קודם (QR הדף הוורוד)", true);
            playBeep(false);
            setTimeout(() => setScanBoxState(''), 1500);
        }
        return;
    }
    
    // שלב ב: ממתין לסריקת מחשב
    if (decodedText.startsWith("EXAMINEE|")) {
        setScanBoxState('error');
        showToast("כבר סרקת נבחן! כעת עליך לסרוק ברקוד מחשב.", true);
        playBeep(false);
        setTimeout(() => setScanBoxState(''), 1500);
        return;
    }
    
    // זה מחשב!
    currentComputerBarcode = decodedText;
    playBeep(true);
    setScanBoxState('success');
    setTimeout(() => setScanBoxState(''), 1000);
    
    // שלב ג: פתיחת הפופ אפ לשמירה
    openModal(currentComputerBarcode);
}

function openModal(computerNumber) {
    isSheetOpen = true;
    document.getElementById('modalStudentName').textContent = currentExamineeData.name;
    document.getElementById('modalComputer').textContent = computerNumber;
    
    // Reset fields to default
    document.getElementById('modalAttendance').value = "1";
    document.getElementById('modalComputerStatus').value = "תקין";
    
    document.getElementById('confirmModal').style.display = 'flex';
    setTimeout(() => {
        document.getElementById('confirmModal').classList.add('show');
    }, 10);
}

function closeModal(cancel = false) {
    document.getElementById('confirmModal').classList.remove('show');
    setTimeout(() => {
        document.getElementById('confirmModal').style.display = 'none';
        isSheetOpen = false;
        lastScanned = '';
        
        if (cancel) {
            // Cancel current scan flow
            resetScannerState();
        }
    }, 300);
}

function resetScannerState() {
    currentExamineeQR = null;
    currentExamineeData = null;
    currentComputerBarcode = '';
    document.querySelector('.top-info p').textContent = 'סרוק את ה-QR מדף הנבחן (הוורוד)';
}

async function confirmSave() {
    const isPresent = document.getElementById('modalAttendance').value;
    const pcStatus = document.getElementById('modalComputerStatus').value;
    
    let bodyData = {
        qr: currentExamineeQR,
        computer: currentComputerBarcode,
        pc_status: pcStatus,
        is_present: isPresent,
        col: currentExamineeData.row,
        seat: currentExamineeData.seat
    };

    closeModal(false); // close but don't reset yet

    try {
        const resp = await fetch('/api/exam-scan-double', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyData)
        });
        const data = await resp.json();
        
        if (data.error) {
            showToast(data.error, true);
            playBeep(false);
            resetScannerState();
            return;
        }
        
        // Success!
        scanCount++;
        document.getElementById('scanCount').textContent = scanCount;
        showToast('✅ נתונים נשמרו בהצלחה למערכת ולגוגל שיטס!');
        playBeep(true);
        resetScannerState();
        
    } catch(e) {
        showToast('שגיאת תקשורת עם השרת', true);
        playBeep(false);
        resetScannerState();
    }
}

function playBeep(success) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = success ? 880 : 300;
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
}
</script>
{% endblock %}
