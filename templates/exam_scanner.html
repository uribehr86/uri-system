{% extends "base.html" %}

{% block title %}סורק נוכחות נבחנים - URI System{% endblock %}

{% block content %}
<style>
  .scan-page { display: flex; flex-direction: column; height: calc(100vh - 60px); overflow: hidden; background: #0a0f1e; color: #fff; font-family: 'Segoe UI', sans-serif; }

  /* Camera */
  .camera-wrap { position: relative; width: 100%; flex: 1; background: #000; overflow: hidden; max-height: 52vh; }
  #reader { width: 100%; height: 100%; }
  #reader video { width: 100%; height: 100%; object-fit: cover; }

  /* Scan overlay box */
  .scan-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .scan-box { width: 210px; height: 130px; border: 3px solid #2563eb; border-radius: 14px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.38); position: relative; transition: border-color 0.3s, box-shadow 0.3s; }
  .scan-box.success { border-color: #22c55e; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35), 0 0 24px rgba(34,197,94,0.6); }
  .scan-box.fail    { border-color: #ef4444; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35), 0 0 24px rgba(239,68,68,0.6); }

  /* Corner accents */
  .scan-box::before, .scan-box::after { content: ''; position: absolute; width: 18px; height: 18px; border-style: solid; transition: border-color 0.3s; }
  .scan-box::before { top: -3px; right: -3px; border-width: 3px 3px 0 0; border-color: inherit; border-radius: 0 8px 0 0; }
  .scan-box::after  { bottom: -3px; left: -3px; border-width: 0 0 3px 3px; border-color: inherit; border-radius: 0 0 0 8px; }

  /* Scan line animation */
  .scan-line { position: absolute; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #60a5fa, transparent); animation: scanMove 1.8s linear infinite; }
  .scan-box.success .scan-line { background: linear-gradient(90deg, transparent, #4ade80, transparent); }
  .scan-box.fail    .scan-line { display: none; }
  @keyframes scanMove { 0%,100% { top: 0; opacity: 0.7; } 50% { top: 100%; opacity: 0.4; } }

  /* Fail message overlay */
  .fail-msg { position: absolute; bottom: -44px; left: 50%; transform: translateX(-50%); background: rgba(239,68,68,0.9); color: #fff; font-size: 0.78rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; white-space: nowrap; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .scan-box.fail .fail-msg { opacity: 1; }
  
  /* Success Burst Fade Away */
  .success-burst { position: absolute; inset: -10px; border: 4px solid #22c55e; border-radius: 18px; opacity: 0; pointer-events: none; z-index: 10; }
  .success-burst.animate { animation: successFadeOut 0.8s ease-out forwards; }
  
  @keyframes successFadeOut {
    0% { transform: scale(0.9); opacity: 1; border-width: 6px; }
    100% { transform: scale(1.3); opacity: 0; border-width: 1px; }
  }

  /* Torch */
  .torch-btn { position: absolute; bottom: 14px; left: 14px; z-index: 20; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.55); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .torch-btn.on { background: #2563eb; }

  /* Bottom panel */
  .bottom-panel { background: #0f172a; border-top: 1px solid rgba(255,255,255,0.07); padding: 10px 14px 14px; flex-shrink: 0; }

  /* Counter & controls */
  .scan-counter { font-size: 0.85rem; color: #94a3b8; }
  .scan-counter span { color: #4ade80; font-weight: 900; font-size: 1.5rem; margin-inline: 4px; }

  /* Waiting hint */
  .waiting-hint { text-align: center; padding: 10px 0 4px; font-size: 0.85rem; color: #94a3b8; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
  .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #2563eb; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } }

  /* Toast */
  #toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    opacity: 0;
    background: #16a34a;
    color: #fff;
    padding: 18px 28px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 1.1rem;
    z-index: 9999;
    transition: transform 0.25s ease, opacity 0.25s ease;
    white-space: pre-wrap;
    max-width: 85vw;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #toast.err { background: #dc2626; }
  #toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

  .back-btn { text-align: center; margin-top: 10px; }
  .back-btn a { color: #64748b; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-block; padding: 6px; }
  .back-btn a:hover { color: #94a3b8; }
</style>

<div class="scan-page">

  <!-- Title info -->
  <div style="padding: 10px; background: rgba(255,255,255,0.02); text-align: center; border-bottom: 1px solid rgba(255,255,255,0.06);">
    <h3 style="margin: 0; font-size: 1.15rem; font-weight: 900; color: #60a5fa;">🎓 סורק נוכחות נבחנים (QR + מחשב)</h3>
  </div>

  <!-- Camera -->
  <div class="camera-wrap">
    <div id="reader"></div>
    <div class="scan-overlay">
      <div class="scan-box" id="scan-box">
        <div class="scan-line"></div>
        <div class="fail-msg" id="fail-msg">⚠️ לא זוהה — קרב את הדף לסורק</div>
        <div class="success-burst" id="success-burst"></div>
      </div>
    </div>
    <button class="torch-btn" id="torch-btn" onclick="toggleTorch()">🔦</button>
  </div>

  <!-- Bottom Panel -->
  <div class="bottom-panel">
    <div style="text-align:center; padding:4px 0;">
      <div class="waiting-hint"><div class="pulse-dot"></div> <span id="attend-hint-text">סרוק QR מדף הנבחן (הוורוד)</span></div>
      
      <!-- Manual computer input (shows ONLY after QR scan) -->
      <div id="attend-computer-wrap" style="display:none; margin-top:8px; padding:10px; background:rgba(37,99,235,0.1); border-radius:12px; border:1px solid rgba(37,99,235,0.3);">
        <div style="color:#94a3b8; font-size:0.8rem; margin-bottom:6px; text-align:right;">📟 הקלד מספר מחשב:</div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="attend-manual-computer" placeholder="לדוגמה: 1324"
            style="flex:1; padding:10px; border-radius:10px; background:#0a0f1e; color:#fff; border:1px solid rgba(255,255,255,0.2); font-size:1rem;"
            onkeypress="if(event.key==='Enter') submitManualComputer()">
          <button onclick="submitManualComputer()" style="padding:10px 16px; border-radius:10px; background:#2563eb; color:#fff; border:none; font-weight:700; cursor:pointer;">✅</button>
        </div>
        <button onclick="saveAttendanceDouble()" style="margin-top:8px; width:100%; padding:10px; border-radius:10px; background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.4); color:#22c55e; font-weight:700; cursor:pointer; font-size:0.9rem;">
          🧪 שמור QR בלבד (ללא מחשב)
        </button>
      </div>
    </div>

    <!-- Stats and Counter -->
    <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
      <div class="scan-counter" style="flex:1; background:rgba(37,99,235,0.1); padding:10px; border-radius:12px; border:1px solid rgba(37,99,235,0.2); text-align:center;">
        נסרקו: <span id="attend-count" style="font-weight:900; font-size:1.4rem;">0</span>
        <span id="attend-total-display" style="color:#64748b;"></span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
        <label style="color:#64748b; font-size:0.7rem;">סה"כ נבחנים</label>
        <input type="number" id="attend-total-input" placeholder="?" min="1"
          style="width:64px; padding:8px; border-radius:10px; background:#0a0f1e; color:#fff; border:1px solid rgba(255,255,255,0.15); font-size:1rem; text-align:center;"
          oninput="updateAttendTotal(this.value)">
      </div>
    </div>

    <!-- Link to Google Sheets -->
    <a href="https://docs.google.com/spreadsheets/d/1YWLJA5T8Uq7IGzlzXSA1PPwrdSIPx9eazEcwWXwh3uM/edit" target="_blank" style="display:block; margin-top:10px; width:100%; padding:14px; border-radius:12px; background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.4); color:#4ade80; font-weight:800; text-align:center; text-decoration:none; font-size:1rem; box-shadow:0 4px 12px rgba(34,197,94,0.1); transition:transform 0.2s;">
      📂 פתח גוגל שיטס (Google Sheets)
    </a>

    <!-- Action buttons -->
    <div style="margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:6px;">
      <button onclick="resetAttendSession()" style="width:100%; padding:10px; border-radius:10px; border:1px solid rgba(251,191,36,0.4); background:rgba(251,191,36,0.08); color:#fbbf24; font-weight:700; cursor:pointer; font-size:0.85rem;">
        ♻️ איפוס סשן
      </button>
      <button onclick="testAttendConnection()" style="width:100%; padding:10px; border-radius:10px; border:1px solid rgba(100,116,139,0.4); background:rgba(100,116,139,0.08); color:#94a3b8; font-weight:700; cursor:pointer; font-size:0.85rem;">
        🔌 בדוק חיבור
      </button>
    </div>
    
    <button id="btn-undo-attend" onclick="undoLastAttend()" style="display:none; margin-top:6px; width:100%; padding:10px; border-radius:10px; border:1px solid rgba(239,68,68,0.4); background:rgba(239,68,68,0.1); color:#f87171; font-weight:700; cursor:pointer; font-size:0.9rem;">
      ↩️ בטל סריקה אחרונה (<span id="undo-name"></span>)
    </button>

    <div class="back-btn">
      <a href="{{ url_for('exam_attendance') }}">← חזרה לרשימת נוכחות</a>
    </div>
  </div>

</div>

<!-- Hidden iframe for background forms (legacy fallback) -->
<iframe id="save-frame" name="save-frame" style="display:none; width:0; height:0; border:none;"></iframe>

<!-- Toast notification element -->
<div id="toast"></div>

<!-- html5-qrcode library -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  let scanner = null;
  let isPaused = false;
  let isSheetOpen = false;

  // Camera handling
  function startScanner() {
    scanner = new Html5Qrcode("reader");
    const config = {
      fps: 10,
      qrbox: function(width, height) {
        return { width: Math.min(width * 0.75, 250), height: Math.min(height * 0.75, 180) };
      },
      aspectRatio: 1.0
    };
    return scanner.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      onScanFailure
    ).catch(err => {
      showToast("❌ שגיאה בטעינת מצלמה", true);
      console.error(err);
    });
  }

  function onScanSuccess(decodedText) {
    if (isPaused || isSheetOpen) return;
    onAttendScan(decodedText);
  }

  function onScanFailure(error) {
    // Silent fail during camera frames
  }

  // Visual success feedback
  function onScanSuccess_visual() {
    setScanBoxState('success');
    const burst = document.getElementById('success-burst');
    burst.classList.remove('animate');
    void burst.offsetWidth; // Trigger reflow
    burst.classList.add('animate');
    
    // play scan sound
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      osc.connect(ctx.destination);
      osc.frequency.value = 600;
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } catch(e){}

    setTimeout(() => {
      setScanBoxState('idle');
      if (!isSheetOpen) resetFailTimer();
    }, 1500);
  }

  function setScanBoxState(state) {
    const box = document.getElementById('scan-box');
    box.classList.remove('success', 'fail');
    if (state === 'success') box.classList.add('success');
    if (state === 'fail')    box.classList.add('fail');
  }

  let failTimer = null;
  function resetFailTimer() {
    if (failTimer) clearTimeout(failTimer);
    setScanBoxState('idle');
    failTimer = setTimeout(() => {
      if (!isSheetOpen) {
        setScanBoxState('fail');
      }
    }, 5000);
  }

  // Flashlight toggle
  let torchOn = false;
  function toggleTorch() {
    if (!scanner) return;
    const btn = document.getElementById('torch-btn');
    torchOn = !torchOn;
    scanner.applyVideoConstraints({
      advanced: [{ torch: torchOn }]
    }).then(() => {
      btn.classList.toggle('on', torchOn);
    }).catch(() => {
      torchOn = !torchOn;
      showToast("🔦 פלאש לא נתמך במכשיר זה", true);
    });
  }

  // Toast
  function showToast(msg, isErr = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = isErr ? 'err show' : 'show';
    if (navigator.vibrate) navigator.vibrate(isErr ? [100,50,100] : 80);
    setTimeout(() => { t.classList.remove('show'); t.classList.remove('err'); }, 4000);
  }

  // ── ATTENDANCE MODE ──────────────────────────────────────────────────────
  let attendQR = null;
  let attendQRData = null;
  let attendComputer = '';
  let attendCount = 0;
  let attendTotal = 0;
  let scannedIds = new Set();
  let lastSavedSheetRow = null;

  function updateAttendTotal(val) {
    attendTotal = parseInt(val) || 0;
    var disp = document.getElementById('attend-total-display');
    disp.textContent = attendTotal > 0 ? ' / ' + attendTotal : '';
  }

  let resetConfirmPending = false;
  let resetConfirmTimer = null;

  function resetAttendSession() {
    if (!resetConfirmPending) {
      resetConfirmPending = true;
      showToast('⚠️ לחץ שוב לאיפוס!', true);
      resetConfirmTimer = setTimeout(function() {
        resetConfirmPending = false;
      }, 3000);
      return;
    }
    clearTimeout(resetConfirmTimer);
    resetConfirmPending = false;

    scannedIds.clear();
    attendCount = 0;
    document.getElementById('attend-count').textContent = '0';
    attendQR = null;
    attendQRData = null;
    attendComputer = '';
    var ht = document.getElementById('attend-hint-text');
    if (ht) ht.textContent = 'סרוק QR מדף הנבחן (הוורוד)';
    
    var cw = document.getElementById('attend-computer-wrap');
    if (cw) cw.style.display = 'none';
    var ci = document.getElementById('attend-manual-computer');
    if (ci) ci.value = '';

    var ub = document.getElementById('btn-undo-attend');
    if (ub) ub.style.display = 'none';
    lastAttendCode = null;
    lastAttendTime = 0;
    resetFailTimer();
    showToast('✅ סשן אופס — מוכן לסריקה!');
  }

  let lastAttendCode = null;
  let lastAttendTime = 0;

  function onAttendScan(code) {
    const now = Date.now();
    if (code === lastAttendCode && now - lastAttendTime < 3000) return;
    lastAttendCode = code;
    lastAttendTime = now;

    // אם הקוד מכיל '|', זהו קוד QR של נבחן
    if (code.includes('|')) {
      const parts = code.split('|');
      if (parts.length >= 3) {
        var id   = parts[3] || parts[1] || '';
        var name = parts[2] || 'נבחן לא ידוע';
        if (id && scannedIds.has(id)) {
          setScanBoxState('fail');
          playBeepDuplicate();
          showToast('⚠️ ' + name + ' כבר נסרק!', true);
          return;
        }
        attendQR = code;
        attendQRData = {
          examName: (parts[0] !== 'EXAMINEE' ? parts[0] : ''),
          id: id,
          name: name,
          row: parts[5] || '',
          seat: parts[6] || ''
        };
        onScanSuccess_visual();
        showToast('✅ ' + attendQRData.name + ' זוהה! סרוק כעת ברקוד מחשב.');
        document.getElementById('attend-hint-text').textContent = 'סרוק ברקוד מחשב עבור: ' + attendQRData.name;
        
        // הצגת קלט ידני למחשב (ללא מיקוד אוטומטי כדי לא להקפיץ מקלדת בנייד)
        document.getElementById('attend-computer-wrap').style.display = 'block';
        document.getElementById('attend-manual-computer').value = '';
      } else {
        setScanBoxState('fail');
        showToast('סרוק קוד QR תקין של נבחן!', true);
      }
      return;
    }

    // אם הקוד לא מכיל '|', זהו ברקוד של מחשב
    if (!attendQR) {
      setScanBoxState('fail');
      showToast('סרוק תחילה קוד QR של נבחן!', true);
      return;
    }

    attendComputer = code;
    onScanSuccess_visual();
    showToast('✅ מחשב ' + attendComputer + ' נסרק — שומר...');
    saveAttendanceDouble();
  }

  function resetAttend() {
    attendQR = null; 
    attendQRData = null;
    attendComputer = '';
    document.getElementById('attend-hint-text').textContent = 'סרוק QR מדף הנבחן (הוורוד)';
    document.getElementById('attend-computer-wrap').style.display = 'none';
    document.getElementById('attend-manual-computer').value = '';
    resetFailTimer();
  }

  function submitManualComputer() {
    var val = document.getElementById('attend-manual-computer').value.trim();
    if (!attendQR) { showToast('סרוק תחילה QR של נבחן!', true); return; }
    if (!val) { showToast('הזן מספר מחשב!', true); return; }
    attendComputer = val;
    showToast('✅ מחשב ' + attendComputer + ' — שומר...');
    saveAttendanceDouble();
  }

  function saveAttendanceDouble() {
    if (!attendQR) { showScanResult(false, 'אין QR — סרוק קודם!'); return; }
    var qrVal       = attendQR;
    var computerVal = attendComputer || 'QR-ONLY';
    var savedName   = attendQRData ? attendQRData.name : '';
    var savedId     = attendQRData ? attendQRData.id   : '';
    var colVal      = attendQRData ? attendQRData.row  : '';
    var seatVal     = attendQRData ? attendQRData.seat : '';

    if (savedId) scannedIds.add(savedId);
    resetAttend();

    var body = JSON.stringify({ qr: qrVal, computer: computerVal, pc_status: 'תקין', is_present: '1', col: colVal, seat: seatVal });
    fetch('/api/exam-scan-double', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body
    })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var ct = r.headers.get('content-type') || '';
      if (r.url.includes('/login') || !ct.includes('json')) {
        window.location.href = '/login';
        throw new Error('הסשן פג — נא להתחבר מחדש');
      }
      return r.json();
    })
    .then(function(data) {
      if (data.error) {
        showScanResult(false, data.error);
      } else {
        attendCount++;
        document.getElementById('attend-count').textContent = attendCount;
        var total = attendTotal > 0 ? ' / ' + attendTotal : '';
        document.getElementById('attend-total-display').textContent = total;
        showScanResult(true, savedName + ' (מחשב ' + computerVal + ')');
        
        // Setup undo
        lastSavedSheetRow = { name: savedName, id: savedId };
        document.getElementById('undo-name').textContent = savedName;
        document.getElementById('btn-undo-attend').style.display = 'block';
        setTimeout(function() {
          document.getElementById('btn-undo-attend').style.display = 'none';
        }, 15000);
      }
    })
    .catch(function(err) {
      showScanResult(false, 'שגיאת תקשורת: ' + err.message);
    });
  }

  function showScanResult(success, name) {
    var existing = document.getElementById('scan-result-banner');
    if (existing) existing.remove();
    var banner = document.createElement('div');
    banner.id = 'scan-result-banner';
    banner.style.cssText = [
      'position:fixed','top:50%','left:50%',
      'transform:translate(-50%,-50%)',
      'padding:28px 40px','border-radius:20px',
      'font-size:1.6rem','font-weight:900',
      'text-align:center','z-index:99999',
      'box-shadow:0 8px 32px rgba(0,0,0,0.4)',
      success
        ? 'background:#16a34a;color:#fff;'
        : 'background:#dc2626;color:#fff;'
    ].join(';');
    banner.innerHTML = success
      ? '&#x2705; נסרק!<br><span style="font-size:1.1rem">' + name + '</span>'
      : '&#x274c; לא נסרק!<br><span style="font-size:1rem">' + name + '</span>';
    document.body.appendChild(banner);
    setTimeout(function() { banner.remove(); }, 3000);
  }

  function testAttendConnection() {
    showToast('🔌 בודק חיבור...');
    fetch('/api/exam-scan-double', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        qr: 'TEST|000000000|Test Person|test_user|test_pass|1|1',
        computer: 'TEST', pc_status: 'תקין', is_present: 1, col: '1', seat: '1'
      })
    })
    .then(function(r) {
      var ct = r.headers.get('content-type') || '';
      if (r.url.includes('/login') || !ct.includes('json')) {
        showToast('❌ הסשן פג — כנס שוב למערכת', true);
        return null;
      }
      return r.json();
    })
    .then(function(d) {
      if (!d) return;
      showToast('✅ חיבור תקין! ' + JSON.stringify(d).substring(0, 50));
    })
    .catch(function(e) {
      showToast('❌ חיבור נכשל: ' + (e.message || e), true);
    });
  }

  function undoLastAttend() {
    if (!lastSavedSheetRow) return;
    fetch('/api/undo-last-scan', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        attendCount = Math.max(0, attendCount - 1);
        if (lastSavedSheetRow.id) scannedIds.delete(lastSavedSheetRow.id);
        document.getElementById('attend-count').textContent = attendCount;
        var total = attendTotal > 0 ? ' / ' + attendTotal : '';
        document.getElementById('attend-total-display').textContent = total;
        showToast('↩️ בוטל: ' + lastSavedSheetRow.name);
        lastSavedSheetRow = null;
        document.getElementById('btn-undo-attend').style.display = 'none';
      } else {
        showToast('שגיאה בביטול', true);
      }
    })
    .catch(function() { showToast('שגיאת תקשורת', true); });
  }

  function playBeepDuplicate() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.2].forEach(function(delay) {
        var osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 440;
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.1);
      });
    } catch(e) {}
  }

  // Load and start scanner
  window.addEventListener('load', () => {
    startScanner().then(() => {
      resetFailTimer();
    });
  });
</script>
{% endblock %}
