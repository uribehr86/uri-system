<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הרשמה - URI SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .card { background-color: #1e293b; color: #f8fafc; border: none; }
        .form-control { background-color: #334155; color: #f8fafc; border: 1px solid #475569; }
        .form-control:focus { background-color: #334155; color: #f8fafc; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4" style="width: 350px;">
        <h3 class="text-center mb-4 text-success">הרשמה למערכת</h3>
        <form method="POST">
            <div class="mb-3">
                <label>שם משתמש</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>סיסמה</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-2">הרשם למערכת</button>
            <a href="/login" class="btn btn-outline-info w-100">חזרה להתחברות</a>
        </form>
    </div>
</body>
</html>
