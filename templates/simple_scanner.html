{% extends 'base.html' %}
{% block title %}סורק בסיסי לנבחנים{% endblock %}
{% block content %}
<style>
  .simple-scan-page { display: flex; flex-direction: column; height: calc(100vh - 60px); overflow: hidden; background: #0a0f1e; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; }
  .top-info { padding: 16px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.07); }
  .top-info h2 { margin: 0 0 6px 0; font-size: 1.4rem; font-weight: 800; color: #60a5fa; }
  
  .camera-wrap { position: relative; width: 100%; flex: 1; background: #000; overflow: hidden; max-height: 50vh; }
  #reader { width: 100%; height: 100%; }
  #reader video { width: 100%; height: 100%; object-fit: cover; }
  
  #result { font-size: 1.5rem; padding: 20px; background: #1e293b; flex: 1; word-wrap: break-word; color: #60a5fa; font-weight: bold; border-top: 4px solid #3b82f6; display: flex; flex-direction: column; align-items: center; justify-content: center; }
</style>

<div class="simple-scan-page">
    <div class="top-info">
        <h2>סורק נבחנים פשוט</h2>
        <p style="color:#94a3b8; margin:0; font-size:0.9rem;">סורק ומסמן נוכחות בלבד</p>
    </div>

    <div class="camera-wrap">
        <div id="reader"></div>
    </div>
    
    <div id="result">ממתין לסריקה... שים את הקוד מול המצלמה.</div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
    const html5QrCode = new Html5Qrcode("reader");
    let lastScan = '';
    
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10 },
        (decodedText) => {
            if(decodedText !== lastScan) {
                lastScan = decodedText;
                document.getElementById('result').innerText = "מתחבר לשרת...";
                
                // User requested just a popup window for testing earlier, but the route exists to save.
                // Since they now say "רוצה שהוא רק רק רק יסרוק לי את QR של הנבחן עצמו בלי קשר לגוגל שיטס בלי קשר למספר מחשב", 
                // We will call the backend which JUST marks is_present=1.
                fetch('/api/simple-scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({qr: decodedText})
                }).then(r => r.json()).then(data => {
                    if(data.success) {
                        document.getElementById('result').innerHTML = 
                            "✅ נשמר בהצלחה!<br><br>" + 
                            "<span style='color:white; font-size:1.2rem;'>" + data.name + " (" + data.id + ")</span><br><br>" +
                            "<div style='font-size:0.95rem; color:#94a3b8; text-align:left; direction:ltr; background:#000; padding:12px; border-radius:8px; word-break:break-all;'>" + 
                            "<b style='color:#60a5fa;'>תוכן ה-QR הגולמי:</b><br>" + decodedText + "</div>";
                        document.getElementById('result').style.color = '#4ade80';
                        playBeep(true);
                    } else {
                        document.getElementById('result').innerText = "❌ שגיאה: " + (data.error || "שגיאה");
                        document.getElementById('result').style.color = '#f87171';
                        playBeep(false);
                    }
                    setTimeout(() => { lastScan = ''; }, 3000); 
                }).catch(err => {
                    document.getElementById('result').innerText = "❌ שגיאת רשת!";
                    playBeep(false);
                });
            }
        },
        () => {}
    ).catch(err => {
        document.getElementById('result').innerText = "שגיאה במצלמה: " + err;
    });

    function playBeep(success) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            osc.frequency.value = success ? 880 : 300;
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }
</script>
{% endblock %}
