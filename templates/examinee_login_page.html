<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דף התחברות לנבחן</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: white;
            color: black;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.2rem;
            margin: 5px 0;
            font-weight: 800;
        }
        .header h2 {
            font-size: 1.1rem;
            margin: 5px 0;
            font-weight: 600;
        }
        .seat-number {
            position: absolute;
            top: 40px;
            left: 20px;
            text-align: center;
        }
        .seat-label {
            display: block;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: -15px;
        }
        .seat-val {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 50px;
            font-size: 1.1rem;
        }
        .info-table td {
            border: 1px solid #000;
            padding: 8px 15px;
        }
        .label-cell {
            width: 30%;
            font-weight: 800;
            background-color: #f2f2f2;
        }
        .value-cell {
            width: 70%;
        }
        .qr-section {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .qr-code {
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #666;
        }
        .qr-label {
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        @media print {
            body { padding: 0; }
            .container { width: 100%; border: none; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="exam-title">{{ exam_name }}</h1>
            <h2 id="classroom-info">דף התחברות - {{ classroom }}</h2>
        </div>

        <div class="seat-number" id="seat-number">
            <span class="seat-label">כיסא</span>
            <span class="seat-val">{{ seat_number }}</span>
        </div>

        <table class="info-table">
            <tr>
                <td class="label-cell">שם הנבחן</td>
                <td class="value-cell">{{ full_name }}</td>
            </tr>
            <tr>
                <td class="label-cell">תעודת זהות</td>
                <td class="value-cell">{{ id_number }}</td>
            </tr>
            <tr>
                <td class="label-cell">תוספת זמן</td>
                <td class="value-cell">{{ extra_time }}</td>
            </tr>
            <tr>
                <td class="label-cell">שם משתמש</td>
                <td class="value-cell" style="font-family: monospace; font-size: 1.2rem;">{{ username }}</td>
            </tr>
            <tr>
                <td class="label-cell">סיסמה</td>
                <td class="value-cell" style="font-family: monospace; font-size: 1.2rem;">{{ password }}</td>
            </tr>
        </table>

        <div class="qr-section">
            <img src="{{ qr_code_url }}" alt="QR Code" class="qr-code">
            <div class="qr-label">לשימוש המשגיח בלבד - סריקת נוכחות</div>
        </div>
    </div>
</body>
</html>
