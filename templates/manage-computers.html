<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>URI SYSTEM - דאשבורד</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d1117;
            color: white;
            padding: 30px;
        }

        .card {
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }

        .num {
            font-size: 4rem;
            color: #58a6ff;
            font-weight: bold;
        }

        .ai-box {
            background: #1c2128;
            border-right: 5px solid #238636;
            padding: 20px;
        }

        input {
            padding: 10px;
            width: 70%;
            border-radius: 5px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
        }

        button {
            padding: 10px 20px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>לוח בקרה - URI SYSTEM</h1>
    <div class="card">
        <h3>סה"כ מחשבים ב-Database</h3>
        <div class="num">{{ total }}</div>
    </div>
    <div class="card ai-box">
        <h3>🤖 שאל את ה-AI על המלאי</h3>
        <input type="text" id="q" placeholder="כמה מחשבים תקינים יש?">
        <button onclick="ask()">שאל</button>
        <p id="ans" style="margin-top:15px;"></p>
    </div>
    <script>
        async function ask() {
            const q = document.getElementById('q').value;
            const res = await fetch('/ask_ai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: q })
            });
            const data = await res.json();
            document.getElementById('ans').innerText = data.answer;
        }
    </script>
</body>

</html>
