<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה - URI SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .login-card { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #334155; }
        .form-control { background-color: #0f172a !important; color: white !important; border: 1px solid #475569 !important; padding: 12px; border-radius: 12px; }
        .btn-primary { background-color: #3b82f6; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; }
        .error-msg { color: #ef4444; text-align: center; margin-bottom: 20px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center text-white fw-bold mb-4">URI SYSTEM</h2>
        {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="שם משתמש" required>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control" placeholder="סיסמה" required>
            </div>
            <button type="submit" class="btn btn-primary shadow-lg">כניסה למערכת</button>
        </form>
        <p class="text-center text-slate-500 mt-4 small">גרסת טכנאי 2026.1</p>
    </div>
</body>
</html>
