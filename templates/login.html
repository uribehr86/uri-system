<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>התחברות – URI System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --accent: #238636; --accent2: #1f6feb;
            --danger: #da3633; --warning: #d29922;
            --text: #e6edf3; --muted: #8b949e;
        }
        body {
            font-family: 'Heebo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at 70% 30%, rgba(31,111,235,.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 20% 80%, rgba(35,134,54,.12) 0%, transparent 55%);
            pointer-events: none;
        }
        .login-wrap {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo .icon { font-size: 3.5rem; display: block; margin-bottom: 10px; }
        .logo h1 { font-size: 2rem; font-weight: 800; }
        .logo p  { color: var(--muted); font-size: .9rem; margin-top: 4px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
        }
        .card h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: .88rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
        .form-control {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: .95rem;
            padding: 11px 14px;
            outline: none;
            transition: border-color .2s;
        }
        .form-control:focus { border-color: var(--accent2); }
        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--accent2);
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .15s, transform .12s;
            margin-top: 8px;
        }
        .btn-login:hover { opacity: .88; transform: translateY(-1px); }
        .alert {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: .88rem;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .alert-danger  { background: rgba(218,54,51,.18); border: 1px solid var(--danger); color: #f85149; }
        .alert-success { background: rgba(35,134,54,.18); border: 1px solid var(--accent); color: #3fb950; }
        .alert-warning { background: rgba(210,153,34,.18); border: 1px solid var(--warning); color: #e3b341; }
        .alert-info    { background: rgba(31,111,235,.18); border: 1px solid var(--accent2); color: #58a6ff; }
        .hint { text-align: center; margin-top: 16px; font-size: .82rem; color: var(--muted); }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="logo">
        <span class="icon">🖥️</span>
        <h1>URI System</h1>
        <p>מערכת ניהול מחשבים</p>
    </div>
    <div class="card">
        <h2>כניסה למערכת</h2>
        {% for cat, msg in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
        {% endfor %}
        <form method="POST">
            <div class="form-group">
                <label for="username">שם משתמש</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="הכנס שם משתמש" autocomplete="username" required/>
            </div>
            <div class="form-group">
                <label for="password">סיסמה</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="הכנס סיסמה" autocomplete="current-password" required/>
            </div>
            <button type="submit" class="btn-login">🔓 כניסה</button>
        </form>
    </div>
</div>
</body>
</html>
