<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>סורק בחינות</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 0;
        background: #0f172a; color: #fff;
        font-family: 'Segoe UI', sans-serif;
        display: flex; flex-direction: column;
        height: 100dvh; overflow: hidden;
      }

      /* ── CAMERA AREA ── */
      .camera-wrap { flex: 1; background: #000; position: relative; min-height: 0; }
      #reader { width: 100%; height: 100%; }
      #reader video { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* scan frame overlay */
      .scan-overlay {
        position: absolute; inset: 0; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
      }
      .scan-frame {
        width: 230px; height: 160px;
        border: 3px solid #2563eb; border-radius: 14px;
        box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
        position: relative; transition: border-color 0.3s;
      }
      .scan-frame.ok  { border-color: #22c55e; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35), 0 0 20px #22c55e; }
      .scan-frame.bad { border-color: #ef4444; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35), 0 0 20px #ef4444; }
      .scan-line {
        position: absolute; width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, #60a5fa, transparent);
        animation: scanMove 1.8s linear infinite;
      }
      @keyframes scanMove { 0%,100% { top: 0; } 50% { top: calc(100% - 2px); } }

      /* ── BOTTOM PANEL ── */
      .bottom-panel {
        background: #0f172a;
        border-top: 1px solid rgba(255,255,255,0.08);
        padding: 12px 14px 16px;
        flex-shrink: 0;
      }

      /* Step indicator */
      .step-badge {
        display: flex; align-items: center; gap: 7px;
        background: rgba(37,99,235,0.15);
        border: 1px solid rgba(37,99,235,0.35);
        border-radius: 30px; padding: 8px 16px;
        font-size: 0.9rem; font-weight: 700; color: #60a5fa;
        margin-bottom: 10px; justify-content: center;
      }
      .step-badge.step2 {
        background: rgba(139,92,246,0.15);
        border-color: rgba(139,92,246,0.35);
        color: #a78bfa;
      }
      .pulse-dot {
        width: 8px; height: 8px; border-radius: 50%; background: currentColor;
        flex-shrink: 0;
        animation: pdot 1.4s ease-in-out infinite;
      }
      @keyframes pdot { 0%,100%{opacity:.3;transform:scale(.9)} 50%{opacity:1;transform:scale(1.2)} }

      /* Scanned student card */
      .data-card {
        display: none;
        background: rgba(139,92,246,0.1);
        border: 1px solid rgba(139,92,246,0.3);
        border-radius: 12px; padding: 8px 14px;
        font-size: 0.9rem; color: #c4b5fd;
        margin-bottom: 10px; font-weight: 700;
        text-align: center;
      }

      /* ── COMPUTER MANUAL INPUT ── */
      .computer-input-box {
        display: none;
        background: rgba(37,99,235,0.08);
        border: 1px solid rgba(37,99,235,0.25);
        border-radius: 14px; padding: 12px;
        margin-bottom: 10px;
      }
      .computer-input-box label {
        display: block; font-size: 0.78rem; color: #94a3b8;
        font-weight: 700; margin-bottom: 7px; text-align: right;
      }
      .computer-input-row { display: flex; gap: 8px; }
      .computer-input-row input {
        flex: 1; padding: 12px 14px; border-radius: 10px;
        background: #0a0f1e; color: #fff;
        border: 1px solid rgba(255,255,255,0.15);
        font-size: 1.2rem; font-weight: 700;
        text-align: center; letter-spacing: 0.05em;
        direction: ltr;
      }
      .computer-input-row input::placeholder { color: #475569; font-weight: 400; font-size: 0.9rem; }
      .computer-input-row button {
        padding: 12px 18px; border-radius: 10px;
        background: #2563eb; color: #fff; border: none;
        font-weight: 800; font-size: 1.1rem; cursor: pointer;
        flex-shrink: 0;
      }

      /* ── BUTTON ROW ── */
      .btn-row { display: flex; gap: 8px; }
      .action-btn {
        flex: 1; padding: 11px 6px; border-radius: 11px;
        font-weight: 700; cursor: pointer;
        font-size: 0.82rem; text-align: center;
        transition: opacity .15s;
        display: flex; align-items: center; justify-content: center; gap: 5px;
        border: 1px solid transparent;
        background: none;
      }
      .btn-photo {
        background: rgba(37,99,235,0.12) !important;
        border-color: rgba(37,99,235,0.35) !important;
        color: #60a5fa;
      }
      .btn-manual {
        background: rgba(251,191,36,0.1) !important;
        border-color: rgba(251,191,36,0.35) !important;
        color: #fbbf24;
      }
      .btn-reset {
        background: rgba(239,68,68,0.1) !important;
        border-color: rgba(239,68,68,0.3) !important;
        color: #f87171;
      }

      /* ── CONFIRM MODAL ── */
      .modal {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.88); z-index: 1000;
        align-items: center; justify-content: center;
        padding: 20px; backdrop-filter: blur(8px);
      }
      .modal-card {
        background: #0f172a; border: 2px solid #2563eb;
        border-radius: 20px; padding: 24px;
        max-width: 360px; width: 100%;
        box-shadow: 0 0 40px rgba(37,99,235,0.3);
      }
      .modal-card h3 { margin: 0 0 16px; color: #60a5fa; font-size: 1.25rem; text-align: center; }
      .info-box {
        background: rgba(37,99,235,0.1); border-radius: 12px;
        padding: 14px; margin-bottom: 16px;
        border: 1px solid rgba(37,99,235,0.2);
      }
      .info-label { font-size: 0.75rem; color: #64748b; display: block; margin-bottom: 2px; }
      .info-val { font-weight: 700; color: #e2e8f0; font-size: 1rem; display: block; margin-bottom: 8px; }
      .info-val.pc { color: #4ade80; font-size: 1.3rem; }

      .chk-row {
        display: flex; align-items: center; gap: 12px;
        background: rgba(255,255,255,0.04); padding: 12px;
        border-radius: 12px; border: 1px solid rgba(255,255,255,0.07);
        margin-bottom: 10px; cursor: pointer;
      }
      .chk-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: #22c55e; cursor: pointer; flex-shrink: 0; }
      .chk-row span { color: #e2e8f0; font-weight: 600; font-size: 0.92rem; }

      .modal-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
      .btn-cancel {
        padding: 14px; border-radius: 12px;
        background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35);
        color: #f87171; font-weight: 700; cursor: pointer; font-size: 0.95rem;
      }
      .btn-save {
        padding: 14px; border-radius: 12px;
        background: #22c55e; border: none;
        color: #000; font-weight: 900; cursor: pointer; font-size: 0.95rem;
      }

      /* ── TOAST ── */
      #toast {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.85);
        opacity: 0; background: #16a34a; color: #fff;
        padding: 18px 28px; border-radius: 18px;
        font-weight: 800; font-size: 1rem;
        z-index: 9999; text-align: center;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        transition: transform .25s, opacity .25s;
        max-width: 85vw; white-space: pre-wrap;
        pointer-events: none; line-height: 1.5;
      }
      #toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      #toast.err { background: #dc2626; }
    </style>
</head>
<body>

  <!-- ══ CAMERA ══ -->
  <div class="camera-wrap">
    <div id="reader"></div>
    <div class="scan-overlay">
      <div class="scan-frame" id="scan-frame">
        <div class="scan-line"></div>
      </div>
    </div>
  </div>

  <!-- ══ BOTTOM PANEL ══ -->
  <div class="bottom-panel">

    <!-- Step badge -->
    <div class="step-badge" id="stepBadge">
      <div class="pulse-dot"></div>
      <span id="stepText">סרוק QR מדף הנבחן (הוורוד)</span>
    </div>

    <!-- Scanned student info (shows after step 1) -->
    <div class="data-card" id="studentCard">
      👤 <span id="studentNameDisplay"></span>
    </div>

    <!-- Computer manual input (shows after step 1) -->
    <div class="computer-input-box" id="computerInputBox">
      <label>💻 הקלד מספר מחשב ידנית:</label>
      <div class="computer-input-row">
        <input type="number" inputmode="numeric" id="manualComputerInput"
               placeholder="מספר מחשב (לדוגמה: 1234)"
               onkeypress="if(event.key==='Enter') submitManualComputer()">
        <button onclick="submitManualComputer()">✅</button>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="btn-row">
      <label class="action-btn btn-photo" for="qr-input-file" id="photoBtnLabel">
        📸 <span id="photoBtnText">צלם QR</span>
      </label>
      <input type="file" id="qr-input-file" accept="image/*" capture="environment" style="display:none;">

      <button class="action-btn btn-manual" id="manualBtn" onclick="toggleManualInput()" style="display:none;">
        ⌨️ הקלד מחשב
      </button>

      <button class="action-btn btn-reset" id="resetBtn" onclick="resetAll()" style="display:none;">
        ↺ אתחל
      </button>
    </div>

  </div>

  <!-- ══ CONFIRM MODAL ══ -->
  <div class="modal" id="confirmModal">
    <div class="modal-card">
      <h3>📋 אישור סריקה</h3>
      <div class="info-box">
        <span class="info-label">נבחן:</span>
        <span class="info-val" id="confName"></span>
        <span class="info-label">מחשב:</span>
        <span class="info-val pc" id="confComputer"></span>
      </div>

      <label class="chk-row">
        <input type="checkbox" id="chkComputer">
        <span>💻 המחשב תקין</span>
      </label>
      <label class="chk-row">
        <input type="checkbox" id="chkPresent">
        <span>✅ הנבחן נוכח (ת.ז / אצבע)</span>
      </label>

      <div class="modal-btn-row">
        <button class="btn-cancel" onclick="closeModal()">❌ ביטול</button>
        <button class="btn-save"   onclick="saveData()">💾 שמור</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- ══ SCRIPTS ══ -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    /* ─────────── STATE ─────────── */
    let step = 1;           // 1 = waiting for QR, 2 = waiting for computer barcode
    let scannedStudent = null;
    let scannedComputer = null;
    let lastScan = '';
    let html5QrCode = null;
    let manualBoxOpen = false;
    let wakeLock = null;

    /* ─────────── WAKE LOCK (מניעת שינה) ─────────── */
    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return; // לא נתמך
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          // המסך שוחרר (אוטומטי ע"י המערכת) — ננסה מחדש
          wakeLock = null;
        });
        console.log('[WakeLock] Screen wake lock acquired');
      } catch (err) {
        console.warn('[WakeLock] Failed:', err);
      }
    }

    // כשהדפדפן חוזר לפוקוס (אחרי שינה / החלפת אפליקציה) — נרכוש מחדש
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && wakeLock === null) {
        await requestWakeLock();
      }
    });

    /* ─────────── CAMERA ─────────── */
    async function startScanner() {
      if (html5QrCode && html5QrCode.isScanning) return;
      html5QrCode = new Html5Qrcode("reader");
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 12, qrbox: { width: 230, height: 160 } },
          onScanSuccess,
          () => {}
        );
      } catch (err) {
        console.warn("Camera start failed:", err);
        showToast("❌ לא ניתן לפתוח מצלמה\nהשתמש בכפתור 📸 לצילום", true);
      }
    }

    /* ─────────── PHOTO FILE FALLBACK ─────────── */
    document.getElementById('qr-input-file').addEventListener('change', e => {
      if (!e.target.files.length) return;
      const file = e.target.files[0];
      e.target.value = '';   // allow picking the same file again

      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.floor(h * MAX / w); w = MAX; }
        canvas.width = w; canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);
        const imageData = ctx.getImageData(0, 0, w, h);

        // Try both normal and inverted to improve detection
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "attemptBoth"
        });
        URL.revokeObjectURL(img.src);

        if (code) {
          onScanSuccess(code.data);
        } else {
          showToast("לא זיהיתי QR בתמונה.\nנסה לצלם מקרוב יותר.", true);
        }
      };
      img.src = URL.createObjectURL(file);
    });

    /* ─────────── SCAN HANDLER ─────────── */
    function onScanSuccess(decodedText) {
      if (decodedText === lastScan) return;
      lastScan = decodedText;

      if (step === 1) {
        // ── Step 1: Examinee QR ──
        if (!decodedText.includes('|')) {
          lastScan = '';
          showToast("❌ זהו ברקוד מחשב\nסרוק תחילה את הדף הוורוד של הנבחן", true);
          flashFrame('bad');
          return;
        }
        const parts = decodedText.split('|');
        const name = parts[2] || 'נבחן';
        const id   = parts[3] || parts[1] || '';

        scannedStudent = { qr: decodedText, id, name };

        document.getElementById('studentNameDisplay').textContent = name;
        document.getElementById('studentCard').style.display = 'block';
        document.getElementById('stepBadge').className = 'step-badge step2';
        document.getElementById('stepText').textContent  = 'סרוק ברקוד מחשב עבור: ' + name;

        document.getElementById('manualBtn').style.display = '';
        document.getElementById('resetBtn').style.display  = '';
        document.getElementById('photoBtnText').textContent = 'צלם ברקוד';

        flashFrame('ok');
        playBeep(880);
        step = 2;
        setTimeout(() => { lastScan = ''; setScanFrame('idle'); }, 2000);

      } else if (step === 2) {
        // ── Step 2: Computer barcode ──
        if (decodedText.includes('|')) {
          lastScan = '';
          showToast("⚠️ זיהיתי QR חדש של נבחן\nסרוק ברקוד מחשב!", true);
          return;
        }
        const num = decodedText.replace(/^0+/, '') || decodedText;
        openConfirmModal(num);
      }
    }

    /* ─────────── MANUAL COMPUTER INPUT ─────────── */
    function toggleManualInput() {
      manualBoxOpen = !manualBoxOpen;
      const box = document.getElementById('computerInputBox');
      const btn = document.getElementById('manualBtn');
      box.style.display = manualBoxOpen ? 'block' : 'none';
      btn.textContent   = manualBoxOpen ? '✖ סגור' : '⌨️ הקלד מחשב';
      if (manualBoxOpen) {
        setTimeout(() => document.getElementById('manualComputerInput').focus(), 100);
      }
    }

    function submitManualComputer() {
      const val = document.getElementById('manualComputerInput').value.trim();
      if (!val) { showToast("הזן מספר מחשב!", true); return; }
      if (!scannedStudent) { showToast("סרוק תחילה QR של נבחן!", true); return; }
      document.getElementById('computerInputBox').style.display = 'none';
      document.getElementById('manualBtn').textContent = '⌨️ הקלד מחשב';
      manualBoxOpen = false;
      openConfirmModal(val);
    }

    /* ─────────── CONFIRM MODAL ─────────── */
    function openConfirmModal(num) {
      scannedComputer = num;
      document.getElementById('confName').textContent     = scannedStudent.name;
      document.getElementById('confComputer').textContent = num;
      document.getElementById('chkComputer').checked = false;
      document.getElementById('chkPresent').checked  = false;
      document.getElementById('confirmModal').style.display = 'flex';
      flashFrame('ok');
      playBeep(660);
    }

    function closeModal() {
      document.getElementById('confirmModal').style.display = 'none';
      scannedComputer = null;
      document.getElementById('manualComputerInput').value = '';
      setScanFrame('idle');
    }

    /* ─────────── SAVE ─────────── */
    async function saveData() {
      const pcStatus   = document.getElementById('chkComputer').checked ? 'תקין' : 'לא תקין';
      const isPresent  = document.getElementById('chkPresent').checked  ? '1' : '0';
      const computerVal = scannedComputer || 'QR-ONLY';
      const studentName = scannedStudent.name;

      document.getElementById('confirmModal').style.display = 'none';

      try {
        const res = await fetch('/api/exam-scan-double', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            qr:         scannedStudent.qr,
            computer:   computerVal,
            pc_status:  pcStatus,
            is_present: isPresent,
            col:        '',
            seat:       ''
          })
        });
        const data = await res.json();
        if (res.ok && !data.error) {
          showToast("✅ נשמר!\n" + studentName + "\nמחשב: " + computerVal);
          playBeep(1200);
        } else {
          showToast("❌ שגיאה:\n" + (data.error || "לא ידוע"), true);
        }
      } catch (e) {
        showToast("❌ שגיאת תקשורת עם השרת", true);
      }

      resetAll();
    }

    /* ─────────── RESET ─────────── */
    function resetAll() {
      step = 1;
      scannedStudent  = null;
      scannedComputer = null;
      lastScan        = '';
      manualBoxOpen   = false;

      document.getElementById('studentCard').style.display      = 'none';
      document.getElementById('computerInputBox').style.display = 'none';
      document.getElementById('stepBadge').className = 'step-badge';
      document.getElementById('stepText').textContent = 'סרוק QR מדף הנבחן (הוורוד)';
      document.getElementById('manualBtn').style.display   = 'none';
      document.getElementById('manualBtn').textContent     = '⌨️ הקלד מחשב';
      document.getElementById('resetBtn').style.display    = 'none';
      document.getElementById('photoBtnText').textContent  = 'צלם QR';
      document.getElementById('manualComputerInput').value = '';
      document.getElementById('confirmModal').style.display = 'none';
      setScanFrame('idle');
    }

    /* ─────────── HELPERS ─────────── */
    function setScanFrame(state) {
      const f = document.getElementById('scan-frame');
      f.className = 'scan-frame' + (state === 'ok' ? ' ok' : state === 'bad' ? ' bad' : '');
    }

    function flashFrame(state) {
      setScanFrame(state);
      setTimeout(() => setScanFrame('idle'), 1500);
    }

    function showToast(msg, isErr = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className   = (isErr ? 'err ' : '') + 'show';
      if (navigator.vibrate) navigator.vibrate(isErr ? [120, 60, 120] : 80);
      setTimeout(() => { t.className = ''; }, 3800);
    }

    function playBeep(freq = 880) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch(e) {}
    }

    /* ─────────── INIT ─────────── */
    window.addEventListener('load', async () => {
      startScanner();
      await requestWakeLock();
    });
  </script>
</body>
</html>
