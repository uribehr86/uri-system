<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סורק בחינות</title>
    <style>
      body { margin: 0; padding: 0; background: #0f172a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
      .camera-wrap { width: 100%; height: 100vh; background: #000; position: relative; }
      #reader { width: 100%; height: 100%; }
      #reader video { width: 100%; height: 100%; object-fit: cover; }
      
      .status-box { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 16px 24px; border-radius: 16px; width: 85%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
      .step { font-size: 1.3rem; font-weight: 900; margin-bottom: 5px; color: #60a5fa; }
      .data-row { font-size: 1.1rem; margin: 4px 0; font-weight: 600; color: #e2e8f0; display: none; }
      
      /* Modal */
      .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(8px); }
      .modal-content { background: #1e293b; width: 90%; max-width: 400px; border-radius: 20px; padding: 30px 24px; text-align: center; border: 1px solid #334155; }
      .modal-content h3 { margin-top: 0; font-size: 1.6rem; color: #fff; margin-bottom: 5px; }
      .modal-content p { color: #94a3b8; font-weight: bold; font-size: 1.2rem; margin-bottom: 24px; }
      .modal-content p span { color: #60a5fa; font-size: 1.4rem; }
      
      select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 20px; font-size: 1.1rem; font-weight: bold; appearance: none; text-align: center; }
      button.save-btn { width: 100%; background: #22c55e; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: 0.2s; }
      button.save-btn:active { transform: scale(0.95); }
      button.reset-btn { margin-top: 15px; padding: 10px 20px; background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

  <div class="camera-wrap">
    <div id="reader"></div>
    
    <div class="status-box">
      <div class="step" id="currentStepText">סרוק דף נבחן (QR)</div>
      
      <div class="data-row" id="studentData">👤 <span id="studentName"></span></div>
      <div class="data-row" id="computerData">💻 מחשב: <span id="computerBarcode"></span></div>
      
      <!-- כפתור חלופי במקרה של תקלת סריקה -->
      <div style="margin-top: 15px;">
          <input type="file" id="qr-input-file" accept="image/*" capture="environment" style="display:none;">
          <button onclick="document.getElementById('qr-input-file').click()" style="background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; width: 100%;">
              📸 קשה לסרוק? צלם תמונה
          </button>
      </div>

      <button class="reset-btn" onclick="resetTest()" style="display:none;" id="resetBtn">ביטול והתחל מחדש</button>
    </div>
  </div>

  <div class="modal" id="myModal">
    <div class="modal-content">
      <h3>אימות נתונים</h3>
      <p>מחשב מזהה: <span id="modalPcNum"></span></p>
      
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <div style="flex: 1; text-align: right;">
          <label style="font-weight: bold; color: #cbd5e1; display: block; margin-bottom: 5px;">כסא (Seat):</label>
          <input type="text" id="seatInput" placeholder="מס' כסא" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1.1rem; text-align: center; box-sizing: border-box;">
        </div>
        <div style="flex: 1; text-align: right;">
          <label style="font-weight: bold; color: #cbd5e1; display: block; margin-bottom: 5px;">טור (Row/Col):</label>
          <input type="text" id="colInput" placeholder="מס' טור" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1.1rem; text-align: center; box-sizing: border-box;">
        </div>
      </div>
      
      <div style="text-align: right; margin-bottom: 8px; font-weight: bold; color: #cbd5e1;">סטטוס תקינות מחשב:</div>
      <select id="pcStatus">
        <option value="תקין">✅ תקין</option>
        <option value="תקול">❌ תקול</option>
      </select>
      
      <div style="text-align: right; margin-bottom: 8px; font-weight: bold; color: #cbd5e1;">סטטוס הגעה נבחן:</div>
      <select id="studentStatus">
        <option value="1">👤 נוכח</option>
        <option value="0">👻 לא נוכח</option>
      </select>
      
      <button class="save-btn" onclick="saveData()">💾 שמירה</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
  let step = 1;
  let scannedStudent = null;
  let scannedComputer = null;
  let lastScan = '';
  let html5QrCode;

  async function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      try {
          await html5QrCode.start(
              { 
                  facingMode: "environment",
                  width: { ideal: 1280 },
                  height: { ideal: 720 }
              },
              { fps: 15, qrbox: { width: 250, height: 250 } },
              onScanSuccess,
              (errorMessage) => { /* ignore background scan errors */ }
          );
      } catch (err) {
          console.error("Camera start failed", err);
          alert("שגיאה בפתיחת המצלמה: ודא שאישרת גישה למצלמה בהגדרות הדפדפן!");
      }
  }

  // --- פתרון צילום תמונה חלופי עם jsQR (אמין פי 100 לתמונות באייפון) ---
  document.getElementById('qr-input-file').addEventListener('change', e => {
      if (e.target.files.length == 0) return;
      const file = e.target.files[0];
      
      const img = new Image();
      img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          // הקטנת התמונה כדי למנוע קריסות זיכרון באייפון
          const MAX_WIDTH = 1000;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
              height = Math.floor(height * (MAX_WIDTH / width));
              width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: "dontInvert",
          });
          
          if (code) {
              onScanSuccess(code.data);
              setTimeout(() => { if (html5QrCode && !html5QrCode.isScanning) startScanner(); }, 1000);
          } else {
              alert("לא זיהיתי ברקוד בתמונה. נסה לצלם קרוב יותר או ללחוץ על הפוקוס במסך של האייפון!");
              if (html5QrCode && !html5QrCode.isScanning) startScanner();
          }
      };
      img.src = URL.createObjectURL(file);
  });

  function onScanSuccess(decodedText) {
      if (decodedText === lastScan) return;
      lastScan = decodedText;
      
      if (step === 1) {
          // שלב 1: סריקת נבחן
          if (!decodedText.startsWith('EXAMINEE|')) {
              lastScan = '';
              return;
          }
          const parts = decodedText.split('|');
          scannedStudent = { id: parts[1], name: parts[2] };
          
          document.getElementById('studentName').textContent = scannedStudent.name;
          document.getElementById('studentData').style.display = 'block';
          
          document.getElementById('currentStepText').textContent = "עכשיו סרוק ברקוד מחשב";
          document.getElementById('currentStepText').style.color = "#a78bfa"; // סגול
          document.getElementById('resetBtn').style.display = 'inline-block';
          step = 2;
          
          playBeep();
          setTimeout(() => lastScan = '', 2000);
      } 
      else if (step === 2) {
          // שלב 2: סריקת מחשב
          scannedComputer = decodedText.replace(/^0+/, ''); // ניקוי אפסים
          
          document.getElementById('computerBarcode').textContent = scannedComputer;
          document.getElementById('computerData').style.display = 'block';
          
          document.getElementById('modalPcNum').textContent = scannedComputer;
          document.getElementById('seatInput').value = ""; 
          document.getElementById('colInput').value = "";
          
          document.getElementById('myModal').style.display = 'flex';
          
          playBeep();
      }
  }

  function resetTest() {
      step = 1;
      scannedStudent = null;
      scannedComputer = null;
      lastScan = '';
      document.getElementById('studentData').style.display = 'none';
      document.getElementById('computerData').style.display = 'none';
      document.getElementById('currentStepText').textContent = "סרוק דף נבחן (QR)";
      document.getElementById('currentStepText').style.color = "#60a5fa";
      document.getElementById('myModal').style.display = 'none';
      document.getElementById('resetBtn').style.display = 'none';
  }

  async function saveData() {
      const seat = document.getElementById('seatInput').value;
      const col = document.getElementById('colInput').value;
      const pcStatus = document.getElementById('pcStatus').value;
      const studentStatus = document.getElementById('studentStatus').value;
      
      try {
          const res = await fetch('/api/exam-scan-double', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                  qr: "EXAMINEE|" + scannedStudent.id + "|" + scannedStudent.name, // Sending minimal expected format
                  computer: scannedComputer,
                  seat: seat,
                  col: col,
                  pc_status: pcStatus,
                  is_present: studentStatus
              })
          });
          const data = await res.json();
          if (res.ok) {
              alert("נשמר בהצלחה במסד הנתונים וסונכרן לגוגל שיטס!");
          } else {
              alert("שגיאה בשמירה: " + (data.error || ""));
          }
      } catch (e) {
          alert("שגיאת תקשורת עם השרת");
      }
      
      resetTest();
  }

  function playBeep() {
      try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          osc.connect(ctx.destination);
          osc.frequency.value = 880;
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
  }

  // Start the scanner automatically when the page loads
  window.onload = () => {
      startScanner();
  };
  </script>
</body>
</html>
