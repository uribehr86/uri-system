{% extends 'base.html' %}
{% block title %}נוכחות נבחנים{% endblock %}
{% block content %}

<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:28px;">
    <div>
        <h1 style="font-size:2rem; font-weight:800;">🎓 נוכחות נבחנים</h1>
        <p style="color:var(--muted); margin-top:4px;">העלאת אקסל ויצירת טפסי וורד</p>
    </div>
    <a href="{{ url_for('exam_attendance_scanner') }}" style="padding:12px 24px; background:linear-gradient(135deg,#1f6feb,#0d4a9e); color:#fff; border-radius:12px; font-weight:700; text-decoration:none; font-size:1rem;">📱 סרוק נוכחות</a>
</div>

<div style="display:flex; gap:20px; flex-wrap:wrap;">

    <!-- ייבוא מ-Excel -->
    <div class="card" style="flex:1; min-width:300px;">
        <h3 style="margin-bottom:14px; font-size:1rem;">📂 ייבוא נבחנים מ-Excel → Google Sheets</h3>
        <form method="POST" action="{{ url_for('exam_attendance_import') }}" enctype="multipart/form-data" style="display:flex; flex-direction:column; gap:12px;">
            <input type="file" name="excel_file" accept=".xlsx,.xls" class="form-control" required>
            <button type="submit" style="padding:10px 20px; background:rgba(31,111,235,0.2); border:1px solid var(--accent2); color:#58a6ff; border-radius:10px; cursor:pointer; font-weight:700; font-family:inherit;">⬆️ העלה ל-Google Sheets</button>
            <span style="color:var(--muted); font-size:0.82rem;">שם הקובץ → תיקיה ב-Drive + גיליון חדש</span>
        </form>
    </div>

    <!-- מחולל Word -->
    <div class="card" style="flex:1; min-width:300px; border:1px solid #a371f7;">
        <h3 style="margin-bottom:14px; font-size:1rem; color:#a371f7;">📄 מחולל תבניות Word</h3>
        <form method="POST" action="{{ url_for('generate_word_docs') }}" enctype="multipart/form-data" style="display:flex; flex-direction:column; gap:12px;">
            <div>
                <label style="color:var(--text-color); font-weight:bold; font-size:0.9rem;">1. קובץ נבחנים (אקסל)</label>
                <input type="file" name="excel_file" accept=".xlsx,.xls" class="form-control" required style="margin-top:5px;">
            </div>
            <div>
                <label style="color:var(--text-color); font-weight:bold; font-size:0.9rem;">2. עיצוב דף נבחן (וורד) [אופציונלי]</label>
                <input type="file" name="word_template" accept=".docx" class="form-control" style="margin-top:5px;">
            </div>
            <button type="submit" style="padding:10px 20px; background:rgba(163,113,247,0.2); border:1px solid #a371f7; color:#a371f7; border-radius:10px; cursor:pointer; font-weight:700; font-family:inherit; margin-top:5px;">✨ הפק מסמך להדפסה</button>
        </form>
    </div>

</div>

{% endblock %}
